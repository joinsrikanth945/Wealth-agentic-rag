# Answer-quality evaluation set for the Agentic RAG assistant.
# Each case describes what a correct answer looks like:
#   expected_facts   facts the answer must contain. A fact can be a list of
#                    accepted alternatives, e.g. ["250,000", "250 000"].
#   expected_source  document that must be cited (private knowledge base cases)
#   expected_path    route(s) the agent may take: private_kb, web_search,
#                    direct, insufficient_evidence
#   forbidden_facts  facts that must NOT appear (used for trap questions)
# Grounding is checked automatically for private_kb cases: every expected fact
# must also appear in the chunks the agent retrieved.

# ---------- Advisor Workstation guide ----------
- id: advisor-session-timeout
  question: After how many minutes of inactivity does an Advisor Workstation session time out?
  expected_facts: ["20 minutes"]
  expected_source: advisor_workstation_guide.md
  expected_path: [private_kb]

- id: advisor-four-eyes
  question: Above what order value is four-eyes approval required in the Advisor Workstation?
  expected_facts: [["250,000", "250 000", "250000"]]
  expected_source: advisor_workstation_guide.md
  expected_path: [private_kb]

- id: advisor-risk-review
  question: How often must a client's risk profile be reviewed?
  expected_facts: [["24 months", "two years", "2 years"]]
  expected_source: advisor_workstation_guide.md
  expected_path: [private_kb]

- id: advisor-overdue-escalation
  question: When are overdue compliance tasks escalated to the team lead?
  expected_facts: ["10 business days"]
  expected_source: advisor_workstation_guide.md
  expected_path: [private_kb]

