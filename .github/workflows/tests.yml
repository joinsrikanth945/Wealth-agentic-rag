name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:          # documentation-only changes don't rebuild or redeploy
      - "README.md"
      - "LICENSE"
      - "img*.png"
  pull_request:            # pull requests run the tests only, never deploy

concurrency:
  group: deploy-main       # one pipeline at a time, so two quick pushes don't clash
  cancel-in-progress: false

env:
  IMAGE: docker.io/joinsrikanth945/agentic-rag
  RESOURCE_GROUP: agentic-rag-rg
  CONTAINER_APP: agentic-rag

jobs:
  # 1. Run the test suite (placeholder keys: every test fakes the outside services)
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key-not-used
      PINECONE_API_KEY: test-key-not-used
      TAVILY_API_KEY: test-key-not-used
      ADMIN_API_KEY: test-admin-key
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock httpx

      - name: Run tests
        run: pytest -v

  # 2. Build the Docker image and push it to Docker Hub (only after tests pass, only on main)
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # 3. Deploy the new image to Azure Container Apps, then 4. smoke-test it
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy the new image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"

      - name: Smoke test the live app
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN"
          # Retry for about 3 minutes to allow for the cold start
          for i in $(seq 1 18); do
            for path in /health /api/health; do
              if curl -fsS --max-time 20 "https://$FQDN$path" > /dev/null; then
                echo "Smoke test passed: https://$FQDN$path responded"
                exit 0
              fi
            done
            echo "Attempt $i: not ready yet, waiting 10 seconds..."
            sleep 10
          done
          echo "Smoke test failed: the deployed app did not respond"
          exit 1
